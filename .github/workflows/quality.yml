name: Quality checks

# Lint and typecheck only. Deployments belong to Vercel's Git integration:
# a preview for every branch, production on merge to main. Nothing here runs
# `vercel build` or `vercel deploy`, otherwise every push deploys twice.

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
